name: Apply message TTL implementation

on:
  push:
    branches:
      - agent/message-ttl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server.js
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("server.js")
          s = p.read_text()

          old = '''// Map of:\n//   boardId -> Map(messageId -> { id, text })\n//\n// Each board therefore has its own independent set of\n// persistent home-automation messages.\nconst apiMessages = new Map();'''
          new = '''// Map of:\n//   boardId -> Map(messageId -> { id, text, expiresAt })\n//\n// Each board therefore has its own independent set of\n// home-automation messages. Messages with expiresAt are\n// automatically removed when their TTL elapses.\nconst apiMessages = new Map();\n\nconst API_MESSAGE_TTL_MIN_MS = 1000;\nconst API_MESSAGE_TTL_MAX_MS = 7 * 24 * 60 * 60 * 1000;\n\nfunction normalizeMessageTtl(rawTtl) {\n  if (rawTtl === undefined || rawTtl === null || rawTtl === "") {\n    return null;\n  }\n\n  const seconds = Number(rawTtl);\n\n  if (!Number.isFinite(seconds) || seconds <= 0) {\n    return null;\n  }\n\n  const milliseconds = Math.round(seconds * 1000);\n\n  return Math.min(\n    Math.max(milliseconds, API_MESSAGE_TTL_MIN_MS),\n    API_MESSAGE_TTL_MAX_MS,\n  );\n}\n\nfunction purgeExpiredApiMessages(boardId) {\n  const messages = apiMessages.get(boardId);\n\n  if (!messages) return false;\n\n  const now = Date.now();\n  let changed = false;\n\n  for (const [messageId, message] of messages) {\n    if (message.expiresAt && message.expiresAt <= now) {\n      messages.delete(messageId);\n      changed = true;\n    }\n  }\n\n  return changed;\n}'''
          if old not in s:
              raise SystemExit("message map anchor not found")
          s = s.replace(old, new, 1)

          old = '''function getApiMessageList(boardId) {\n  return Array.from(getApiMessages(boardId).values());\n}'''
          new = '''function getApiMessageList(boardId) {\n  purgeExpiredApiMessages(boardId);\n  return Array.from(getApiMessages(boardId).values());\n}'''
          if old not in s:
              raise SystemExit("message list anchor not found")
          s = s.replace(old, new, 1)

          old = '''  const id =\n    typeof req.body?.id === "string"\n      ? req.body.id.trim()\n      : "";\n\n  const text =\n    typeof req.body?.text === "string"\n      ? req.body.text.trim()\n      : "";\n\n  if (!id || !text) {'''
          new = '''  const id =\n    typeof req.body?.id === "string"\n      ? req.body.id.trim()\n      : "";\n\n  const text =\n    typeof req.body?.text === "string"\n      ? req.body.text.trim()\n      : "";\n\n  const ttlMs = normalizeMessageTtl(req.body?.ttl);\n\n  if (\n    req.body?.ttl !== undefined &&\n    req.body?.ttl !== null &&\n    req.body?.ttl !== "" &&\n    ttlMs === null\n  ) {\n    return res.status(400).json({\n      ok: false,\n      error: "ttl must be a positive number of seconds",\n    });\n  }\n\n  if (!id || !text) {'''
          if old not in s:
              raise SystemExit("POST validation anchor not found")
          s = s.replace(old, new, 1)

          old = '''  const messages = getApiMessages(result.id);\n\n  messages.set(id, {\n    id,\n    text: text.slice(0, 1000),\n  });'''
          new = '''  const messages = getApiMessages(result.id);\n\n  messages.set(id, {\n    id,\n    text: text.slice(0, 1000),\n    ...(ttlMs !== null\n      ? { expiresAt: Date.now() + ttlMs }\n      : {}),\n  });'''
          if old not in s:
              raise SystemExit("message set anchor not found")
          s = s.replace(old, new, 1)

          old = '''// Add or replace a persistent automation message.\n//\n// POST /api/board/ABC123/messages\n//\n// {\n//   "id": "garage",\n//   "text": "GARAGE DOOR OPEN"\n// }'''
          new = '''// Add or replace an automation message.\n//\n// POST /api/board/ABC123/messages\n//\n// {\n//   "id": "garage",\n//   "text": "GARAGE DOOR OPEN",\n//   "ttl": 120\n// }\n//\n// ttl is optional and is specified in seconds. When present,\n// the message is removed automatically after that many seconds.\n// Re-posting the same id replaces the message and resets its TTL.'''
          if old not in s:
              raise SystemExit("message comment anchor not found")
          s = s.replace(old, new, 1)

          old = '''setInterval(\n  () => {\n    const now = Date.now();\n\n    for (const [id, b] of boards) {'''
          new = '''setInterval(\n  () => {\n    for (const [boardId, messages] of apiMessages) {\n      const changed = purgeExpiredApiMessages(boardId);\n\n      if (changed) {\n        const board = boards.get(boardId);\n\n        if (board?.boardWs && board.boardWs.readyState === 1) {\n          sendApiMessages(board, boardId);\n          board.lastActive = Date.now();\n        }\n      }\n\n      if (messages.size === 0) {\n        apiMessages.delete(boardId);\n      }\n    }\n\n    const now = Date.now();\n\n    for (const [id, b] of boards) {'''
          if old not in s:
              raise SystemExit("cleanup anchor not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate
        run: node --check server.js

      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/apply-message-ttl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/apply-message-ttl.yml
          git commit -m "Add expiring automation messages"
          git push
