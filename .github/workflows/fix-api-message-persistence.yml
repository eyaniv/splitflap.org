name: Fix API message persistence

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    # Skip the commit created by this workflow itself.
    if: ${{ !contains(github.event.head_commit.message, 'Fix API message persistence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove API message persistence
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("server.js")
          s = p.read_text()

          old = '''  sendApiMessages(result.board, result.id);\n\n  result.board.lastActive = Date.now();\n  savePrimaryState(result.board);\n\n  res.json({'''
          new = '''  sendApiMessages(result.board, result.id);\n\n  result.board.lastActive = Date.now();\n\n  res.json({'''
          if old not in s:
              raise SystemExit("POST persistence block not found")
          s = s.replace(old, new, 1)

          old = '''      sendApiMessages(board, boardId);\n      board.lastActive = Date.now();\n      savePrimaryState(board);\n    }'''
          new = '''      sendApiMessages(board, boardId);\n      board.lastActive = Date.now();\n    }'''
          if old not in s:
              raise SystemExit("DELETE persistence block not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              '// Get persistent API-managed messages for a board.',
              '// Get runtime API-managed messages for a board.',
              1,
          )
          s = s.replace(
              '// Remove a persistent automation message.',
              '// Remove a runtime automation message.',
              1,
          )

          p.write_text(s)
          PY

      - name: Validate server.js
        run: node --check server.js

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-api-message-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/fix-api-message-persistence.yml
          git commit -m "Fix API message persistence"
          git push
